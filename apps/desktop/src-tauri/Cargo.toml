[package]
name = "continue-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
clipboard-rs = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
whoami = { version = "2", default-features = false, features = ["std"] }
# The OS store for device keys: Keychain, Windows Credential Manager, Secret Service.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
discovery = { path = "../../../crates/discovery" }
protocol = { path = "../../../crates/protocol" }
identity = { path = "../../../crates/identity" }
transport = { path = "../../../crates/transport" }
pairing = { path = "../../../crates/pairing" }
sessions = { path = "../../../crates/sessions" }
capabilities = { path = "../../../crates/capabilities" }
permissions = { path = "../../../crates/permissions" }
history = { path = "../../../crates/history" }
clipboard = { path = "../../../crates/clipboard" }
notifications = { path = "../../../crates/notifications" }
quinn = "0.11"
parking_lot = "0.12"
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
