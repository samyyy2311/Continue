version = 1

# Defaults for files that can't carry a header (config, lockfiles, icons).
# A header in the file itself always wins.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Contributors to the Continue project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "apps/**"
precedence = "closest"
SPDX-FileCopyrightText = "Contributors to the Continue project"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "apps/android/app/src/main/res/font/instrument_sans.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2022 The Instrument Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"
