[workspace]
members = [
    "crates/limits",
    "crates/crypto",
    "crates/identity",
    "crates/protocol",
    "crates/transport",
    "crates/discovery",
    "crates/pairing",
    "crates/sessions",
    "crates/capabilities",
    "crates/permissions",
    "crates/transfer",
    "crates/clipboard",
    "crates/notifications",
    "crates/history",
    "crates/device",
    "crates/ffi",
    "tests/peer",
]
resolver = "2"
# The Tauri app builds on its own; it needs system WebKit libraries the core crates do not.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = []
publish = false

[workspace.dependencies]
# Async runtime: individual crates declare only the features they need
tokio = "1"

# QUIC and TLS
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# Protocol
prost = "0.13"
prost-build = "0.13"
bytes = "1"

# Discovery
mdns-sd = "0.11"

# FFI
uniffi = "0.28"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 0
debug = true
