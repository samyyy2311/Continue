syntax = "proto3";

package continue.v1;

// Opens a calls stream; answered with a CallsReply.
message CallsMessage {
  oneof body {
    // The phone telling a computer about a call.
    Call call = 1;
    // A computer asking the phone to answer, decline or silence the ringing call, or to call a number.
    CallAction action = 2;
  }
}

message Call {
  enum State {
    RINGING = 0;
    TALKING = 1;
    ENDED = 2;
  }
  State state = 1;
  string number = 2; // empty when withheld
  string name = 3;   // from the phone's contacts, empty when unknown
}

message CallAction {
  enum Kind {
    ANSWER = 0;
    DECLINE = 1;
    // Stops the ringtone and leaves the call ringing.
    SILENCE = 2;
    // Calls `number` from the phone.
    DIAL = 3;
  }
  Kind kind = 1;
  string number = 2;
}

message CallsReply {
  // Whether the call was shown, or the action done.
  bool done = 1;
}
