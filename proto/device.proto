syntax = "proto3";

package continue.v1;

// Operating system/platform running on the device.
// PLATFORM_UNSPECIFIED (0) is the safe proto3 default and must remain zero.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_ANDROID     = 1;
  PLATFORM_WINDOWS     = 2;
  PLATFORM_LINUX       = 3;
  PLATFORM_MACOS       = 4;
  PLATFORM_IOS         = 5;
}

// Stable device descriptor exchanged during discovery and pairing.
message DeviceInfo {
  // Base64Url-no-padding SHA-256 fingerprint of the Ed25519 identity public key.
  // 43 characters. Never transmitted in mDNS advertisements.
  string fingerprint = 1;

  // Human-readable name, max 64 UTF-8 bytes. May be empty during discovery.
  string display_name = 2;

  Platform platform = 3;

  // Application protocol version. Incremented on wire-incompatible changes.
  uint32 protocol_version = 4;

  // Ed25519 identity public key bytes (32 bytes).
  // Used by the peer to recompute and verify the fingerprint.
  bytes ed25519_public_key = 5;
}

// A device's battery, so the other side can show it.
message DeviceStatus {
  uint32 battery_percent = 1; // 0 to 100
  bool   charging        = 2;
  // Signal bars from 0 to 4, absent without a mobile network or Wi-Fi.
  optional uint32 cell_bars = 3;
  optional uint32 wifi_bars = 4;
  string carrier = 5; // the mobile network's name, empty without one
  string network = 6; // the mobile network's kind, such as "5G" or "LTE", empty when unknown
}

// How a device looks, so the other side can draw it.
message DeviceLook {
  // The wallpaper's main colour as 0xRRGGBB, or 0 when it isn't known.
  uint32 wallpaper_color = 1;
  // A small JPEG of the wallpaper, when the device can read it.
  bytes wallpaper = 2;
}
